name: Build and publish Docker image

on:
  workflow_call:
    inputs:
      image:
        description: Image name and build-context directory
        required: true
        type: string
      nginx_component_tag:
        description: Publish a second tag using actual Nginx, Alpine and bouncer versions
        type: boolean
        default: false
    secrets:
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: DockerHub
    timeout-minutes: 45
    env:
      IMAGE_NAME: ${{ inputs.image }}
      IMAGE_REPOSITORY: ${{ vars.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_USERNAME || github.repository_owner }}/${{ inputs.image }}
    steps:
      - name: Check component-tag target
        if: inputs.nginx_component_tag && inputs.image != 'nginx-crowdsec-bouncer'
        run: |
          echo '::error::Component version tags are only supported for nginx-crowdsec-bouncer.'
          exit 1

      - name: Check manual publishing target
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main && "$GITHUB_REF" != refs/tags/"${IMAGE_NAME}-v"* ]]; then
            echo '::error::Select main or a version tag for this image when running the workflow manually.'
            exit 1
          fi

      - name: Check Docker Hub credentials
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::Set the DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN secret in the DockerHub environment.'
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 12
        with:
          images: ${{ vars.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_USERNAME || github.repository_owner }}/${{ inputs.image }}
          flavor: latest=${{ inputs.nginx_component_tag && 'false' || 'auto' }}
          tags: |
            type=semver,pattern={{version}},match=^${{ inputs.image }}-v(.*)$
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr
            type=sha,enable=${{ !inputs.nginx_component_tag }}

      - name: Validate release version
        if: github.ref_type == 'tag'
        shell: bash
        env:
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Invalid SemVer falls back to a sha-* metadata version; reject it.
          if [[ ! "$IMAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ || "$GITHUB_REF_NAME" != "${IMAGE_NAME}-v${IMAGE_VERSION}" ]]; then
            echo '::error::Use an image-vX.Y.Z tag, optionally followed by a prerelease such as -rc.1. Build metadata (+...) is not supported.'
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./${{ inputs.image }}
          file: ./${{ inputs.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          # Refresh APK packages on every build, even when the Dockerfile is unchanged.
          no-cache: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Record actual rsync component versions on both architectures
        if: (inputs.image == 'rsync-receiver' || inputs.image == 'rsync-source') && github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf '### Rsync image components\n\n'
            printf 'Image: `%s@%s`\n\n' "$IMAGE_REPOSITORY" "$IMAGE_DIGEST"
            for platform in linux/amd64 linux/arm64; do
              printf '#### %s\n\n```text\n' "$platform"
              docker run --rm --pull=always --platform "$platform" \
                --entrypoint /bin/sh "$IMAGE_REPOSITORY@$IMAGE_DIGEST" -ec '
                  printf "Alpine: %s\n" "$(cat /etc/alpine-release)"
                  apk info -v rsync rrsync openssh-server
                '
              printf '```\n\n'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Read actual Nginx component versions on both architectures
        if: inputs.nginx_component_tag && github.event_name != 'pull_request'
        id: components
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 nginx-crowdsec-bouncer/image-versions.py \
            "$IMAGE_REPOSITORY@$IMAGE_DIGEST" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish component tag for the same image
        if: inputs.nginx_component_tag && github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          COMPONENT_TAG: ${{ steps.components.outputs.tag }}
          RELEASE_IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE_REPOSITORY:$COMPONENT_TAG" \
            "$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          {
            printf '### Published Nginx CrowdSec image\n\n'
            printf -- '- Release: `%s`\n' "$RELEASE_IMAGE"
            printf -- '- Components: `%s:%s`\n' "$IMAGE_REPOSITORY" "$COMPONENT_TAG"
            printf -- '- Digest: `%s`\n' "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
