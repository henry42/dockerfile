name: Build and publish Docker image

on:
  workflow_call:
    inputs:
      image:
        description: Image name and build-context directory
        required: true
        type: string
      version_tag:
        description: Immutable component-version tag, when provided by the caller
        type: string
        default: ''
      build_args:
        description: Explicit, non-secret build arguments
        type: string
        default: ''
      verify:
        description: Run the Nginx bouncer integration verification before publishing
        type: boolean
        default: false
    secrets:
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: DockerHub
    timeout-minutes: 45
    env:
      IMAGE_NAME: ${{ inputs.image }}
    steps:
      - name: Check manual publishing target
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            exit 0
          fi
          if [[ -n "$VERSION_TAG" ]]; then
            if [[ "$GITHUB_REF" == "refs/tags/$VERSION_TAG" ]]; then exit 0; fi
          elif [[ "$GITHUB_REF" == refs/tags/"${IMAGE_NAME}-v"* ]]; then
            exit 0
          fi
          echo '::error::Select main or a matching release tag for this image when running the workflow manually.'
          exit 1

      - name: Validate component release tag
        if: github.ref_type == 'tag' && inputs.version_tag != ''
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
        shell: bash
        run: |
          if [[ ! "$VERSION_TAG" =~ ^nginx[0-9]+\.[0-9]+\.[0-9]+-alpine[0-9]+\.[0-9]+-bouncer[0-9]+\.[0-9]+\.[0-9]+$ || "$GITHUB_REF_NAME" != "$VERSION_TAG" ]]; then
            echo '::error::The Git tag, component versions and Docker image tag must match exactly.'
            exit 1
          fi

      - name: Check Docker Hub credentials
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::Set the DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN secret in the DockerHub environment.'
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 12
        with:
          images: ${{ vars.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_USERNAME || github.repository_owner }}/${{ inputs.image }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}},match=^${{ inputs.image }}-v(.*)$,enable=${{ inputs.version_tag == '' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr
            type=sha
            type=raw,value=${{ inputs.version_tag || 'unused-component-version' }},enable=${{ inputs.version_tag != '' }},priority=1000

      - name: Validate release version
        if: github.ref_type == 'tag' && inputs.version_tag == ''
        shell: bash
        env:
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Invalid SemVer falls back to a sha-* metadata version; reject it.
          if [[ ! "$IMAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ || "$GITHUB_REF_NAME" != "${IMAGE_NAME}-v${IMAGE_VERSION}" ]]; then
            echo '::error::Use an image-vX.Y.Z tag, optionally followed by a prerelease such as -rc.1. Build metadata (+...) is not supported.'
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Protect immutable component-version tag
        if: github.event_name != 'pull_request' && inputs.version_tag != ''
        env:
          IMAGE_REPOSITORY: ${{ vars.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_USERNAME || github.repository_owner }}/${{ inputs.image }}
          VERSION_TAG: ${{ inputs.version_tag }}
        shell: bash
        run: |
          if docker buildx imagetools inspect "$IMAGE_REPOSITORY:$VERSION_TAG" >manifest-check.log 2>&1; then
            echo "::error::Immutable tag $IMAGE_REPOSITORY:$VERSION_TAG already exists; it will not be overwritten."
            exit 1
          elif ! grep -Eqi 'not found|manifest unknown|404' manifest-check.log; then
            cat manifest-check.log
            exit 1
          fi

      - name: Build local Nginx verification image
        if: inputs.verify
        uses: docker/build-push-action@v7
        with:
          context: ./${{ inputs.image }}
          file: ./${{ inputs.image }}/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          pull: true
          tags: nginx-crowdsec-verification:${{ github.sha }}
          build-args: ${{ inputs.build_args }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}

      - name: Verify modules, runtime configuration, LAPI and AppSec fail-open
        if: inputs.verify
        env:
          VERIFY_IMAGE: nginx-crowdsec-verification:${{ github.sha }}
        run: python3 nginx-crowdsec-bouncer/verify.py "$VERIFY_IMAGE"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ inputs.image }}
          file: ./${{ inputs.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build_args }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
